<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Centro de Control · Rinze Studio</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Centro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E17; --s1:#121824; --s2:#1E293B; --line:#253248; --line2:#334155;
  --tx:#E6EDF6; --tx2:#94A3B8; --tx3:#64748B;
  --g:#00FF88; --c:#00D2FE; --grad:linear-gradient(135deg,#00FF88,#00D2FE);
  --rail:248px; --top:56px; --nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

.shell{display:grid;grid-template-columns:var(--rail) 1fr;height:100%}

/* Barra lateral */
.rail{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(18px + var(--safe-t)) 14px 18px;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand .wm{line-height:1}
.brand .wm b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .wm span{display:block;font-size:10px;font-weight:600;letter-spacing:.28em;color:var(--tx2);margin-top:4px}
.sec{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:14px 10px 6px}
.nav-list{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--tx2);font-size:14px;font-weight:500;position:relative;text-align:left;width:100%;transition:background .15s,color .15s}
.item:hover{background:var(--s2);color:var(--tx)}
.item.on{background:rgba(0,255,136,.08);color:var(--tx)}
.item.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.item.on svg.i{stroke:url(#gr)}
.item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);opacity:0;transition:opacity .2s}
.item.alive .dot{opacity:1}
.item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tx3)}
.ver{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--g)}

/* Zona principal */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{height:calc(var(--top) + var(--safe-t));padding-top:var(--safe-t)!important;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:rgba(10,14,23,.85);backdrop-filter:blur(8px)}
.topbar .ttl{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .ttl h1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl .host{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .acts{margin-left:auto;display:flex;gap:4px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;color:var(--tx2);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.btn:hover{background:var(--s2);color:var(--tx)}
.btn.pri{background:var(--grad);color:#04120B;font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:#04120B}
.view{position:relative;flex:1;min-height:0}

/* Inicio */
.home{position:absolute;inset:0;overflow:auto;padding:36px clamp(18px,4vw,48px) 48px}
.hello{font-size:13px;color:var(--tx2);font-weight:500}
.home h2{font-size:clamp(26px,3.4vw,36px);font-weight:700;letter-spacing:-.02em;margin:6px 0 6px}
.home h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.home .sub{color:var(--tx2);font-size:14px;max-width:560px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:28px;max-width:1200px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left;transition:border-color .2s,transform .2s,background .2s;min-height:200px}
.card:hover{border-color:rgba(0,255,136,.45);transform:translateY(-2px);background:#141B29}
.card .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line2)}
.card .ic svg.i{stroke:url(#gr)}
.card h3{font-size:16px;font-weight:600}
.card p{font-size:13px;color:var(--tx2);line-height:1.55;margin-top:4px}
.card .body{flex:1;display:flex;flex-direction:column;gap:14px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--s2);color:var(--tx2);border:1px solid var(--line)}
.chip.h{color:var(--c);border-color:rgba(0,210,254,.3)}
.card.add{border-style:dashed;background:transparent;align-items:flex-start;justify-content:center;cursor:default}
.card.add:hover{transform:none;border-color:var(--line2)}
.card.add .ic svg.i{stroke:var(--tx3)}
.card.add code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--g)}
.tip{margin-top:28px;max-width:1200px;font-size:12px;color:var(--tx3);display:flex;gap:8px;align-items:center}

/* Apps embebidas */
.frames{position:absolute;inset:0}
.frame{position:absolute;inset:0;visibility:hidden}
.frame.on{visibility:visible}
.frame iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .3s}
.loader.gone{opacity:0;pointer-events:none}
.loader .box{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--s2);border-top-color:var(--g);border-right-color:var(--c);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader .msg{font-size:14px;color:var(--tx2)}
.loader .slow{display:none;flex-direction:column;align-items:center;gap:12px;font-size:13px;color:var(--tx3);max-width:320px}
.loader.late .slow{display:flex}

/* Instalar */
.inst{display:none}
.inst.show{display:inline-flex}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.7);display:none;align-items:flex-end;justify-content:center;padding:16px}
.sheet.show{display:flex}
.sheet .pan{background:var(--s1);border:1px solid var(--line2);border-radius:18px;max-width:420px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;margin-bottom:var(--safe-b)}
.sheet h3{font-size:17px;font-weight:600}
.sheet ol{padding-left:20px;color:var(--tx2);font-size:14px;line-height:1.7}
.sheet b{color:var(--tx)}

/* Navegación inferior (celular) */
.bottom{display:none}

/* Tablet: barra de íconos */
@media (max-width:1100px){
  :root{--rail:76px}
  .rail{padding:16px 10px;align-items:center}
  .brand{padding:4px 0 14px}
  .brand .wm,.sec,.item .lbl,.rail-foot .who{display:none}
  .item{justify-content:center;padding:12px;width:52px}
  .item.on::before{left:-10px}
  .item .dot{position:absolute;top:8px;right:8px;margin:0;width:6px;height:6px}
  .rail-foot{flex-direction:column;gap:8px;padding:12px 0 0}
  .item[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:62px;top:50%;transform:translateY(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--tx);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:20;pointer-events:none}
}

/* Celular: navegación abajo */
@media (max-width:640px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-bottom:calc(var(--nav) + var(--safe-b))}
  .topbar{padding:0 8px 0 14px;gap:8px}
  .topbar .btn .t{display:none}
  .topbar .btn{padding:0 10px}
  .home{padding:24px 16px 32px}
  .grid{grid-template-columns:1fr;gap:12px;margin-top:20px}
  .card{min-height:0;flex-direction:row;align-items:flex-start;padding:16px;gap:14px}
  .card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .card .chips{margin-top:0}
  .card.add{flex-direction:row;align-items:center}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--s1);border-top:1px solid var(--line);overflow-x:auto;z-index:30}
  .bottom button{flex:1 0 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--tx3);position:relative}
  .bottom button.on{color:var(--tx)}
  .bottom button.on svg.i{stroke:url(#gr)}
  .bottom button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:0 0 2px 2px;background:var(--grad)}
  .bottom .lbl{max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FF88"/><stop offset="1" stop-color="#00D2FE"/></linearGradient></defs>
</svg>

<div class="shell">
  <aside class="rail" aria-label="Aplicaciones">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="10" fill="#121824" stroke="#253248"/>
        <path d="M13 30V10h8.5a5.5 5.5 0 0 1 0 11H13M20 21l7 9" fill="none" stroke="url(#gr)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="13" cy="10" r="2.6" fill="#0A0E17" stroke="#00FF88" stroke-width="2"/>
        <circle cx="13" cy="30" r="2.6" fill="#0A0E17" stroke="#00FF88" stroke-width="2"/>
        <circle cx="27" cy="30" r="2.6" fill="#0A0E17" stroke="#00D2FE" stroke-width="2"/>
      </svg>
      <div class="wm"><b>Rinze</b><span>STUDIO</span></div>
    </div>
    <button class="item" id="nav-home" data-tip="Inicio" onclick="go('')"></button>
    <div class="sec">Aplicaciones</div>
    <nav class="nav-list" id="navList"></nav>
    <button class="item inst" id="instRail" data-tip="Instalar app" onclick="instalar()"></button>
    <div class="rail-foot"><span class="who">Centro de Control</span><span class="ver" id="ver"></span></div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view">
      <section class="home" id="home"></section>
      <div class="frames" id="frames"></div>
    </div>
  </main>
</div>
<nav class="bottom" id="bottom" aria-label="Aplicaciones"></nav>
<div class="sheet" id="sheet" onclick="if(event.target===this)cerrarSheet()">
  <div class="pan" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <h3 id="sheetT">Instalar el Centro de Control</h3>
    <ol id="sheetPasos"></ol>
    <button class="btn pri" style="justify-content:center" onclick="cerrarSheet()">Entendido</button>
  </div>
</div>

<script>
const VERSION = 'V.3';

/* Copia de respaldo del registro. La fuente principal es apps.json. */
const RESPALDO = [
  {id:'produccion',nombre:'Control Producción',corto:'Producción',descripcion:'Cálculo y control de la producción diaria.',url:'https://calculoproduccion.vercel.app',icono:'produccion',dispositivos:['Laptop','Tablet'],hosting:'Vercel',modo:'embebida'},
  {id:'entregas',nombre:'Entregas a CEDI',corto:'Entregas',descripcion:'Formularios, órdenes de compra, citas y QR para el CEDI.',url:'https://kurtbrinze.github.io/CD/',icono:'entregas',dispositivos:['Laptop'],hosting:'GitHub',modo:'embebida'},
  {id:'desviaciones',nombre:'Desviaciones',corto:'Desviaciones',descripcion:'Análisis de lo pedido contra lo entregado.',url:'https://kurtbrinze.github.io/Desviaciones/',icono:'desviaciones',dispositivos:['Laptop'],hosting:'GitHub',modo:'embebida'},
  {id:'agenda',nombre:'Agenda',corto:'Agenda',descripcion:'Citas, tareas y pendientes de la panadería.',url:'https://agenda-chi-wheat.vercel.app/',icono:'agenda',dispositivos:['Laptop','Celular'],hosting:'Vercel',modo:'embebida'}
];

const ICONOS = {
  inicio:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  produccion:'<path d="M5 13.5A2.5 2.5 0 0 1 4 9.5C4 6.5 7.6 4 12 4s8 2.5 8 5.5a2.5 2.5 0 0 1-1 4V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M9 8.5l1 2M13 8l1 2"/>',
  entregas:'<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3.5V16h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  desviaciones:'<path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/><path d="M3 21h18"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h2M14 14h2M8 17.5h2"/>',
  inventario:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  documento:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  camara:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  grafica:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  caja:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 14h6"/>',
  recargar:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  aparte:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  instalar:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
const ico = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n]||ICONOS.caja}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hostDe = u => { try { return new URL(u).host; } catch { return u; } };

let APPS = [];
let actual = '';
const frames = {};

const guardar = (k,v) => { try { localStorage.setItem('cc.'+k, v); } catch {} };
const leer = k => { try { return localStorage.getItem('cc.'+k); } catch { return null; } };

async function cargarRegistro(){
  try {
    const r = await fetch('apps.json', {cache:'no-store'});
    if (!r.ok) throw 0;
    const j = await r.json();
    APPS = (j.apps || j).filter(a => a && a.id && a.url);
  } catch { APPS = RESPALDO; }
}

function pintarNav(){
  document.getElementById('nav-home').innerHTML = ico('inicio') + '<span class="lbl">Inicio</span>';
  document.getElementById('navList').innerHTML = APPS.map(a =>
    `<button class="item" data-id="${esc(a.id)}" data-tip="${esc(a.nombre)}" onclick="go('${esc(a.id)}')">${ico(a.icono)}<span class="lbl">${esc(a.nombre)}</span><span class="dot"></span></button>`
  ).join('');
  document.getElementById('bottom').innerHTML =
    `<button data-id="" onclick="go('')">${ico('inicio')}<span class="lbl">Inicio</span></button>` +
    APPS.map(a => `<button data-id="${esc(a.id)}" onclick="go('${esc(a.id)}')">${ico(a.icono)}<span class="lbl">${esc(a.corto || a.nombre)}</span></button>`).join('');
  document.getElementById('ver').textContent = VERSION;
}

function saludo(){
  const h = new Date().getHours();
  return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
}

function pintarInicio(){
  const fecha = new Date().toLocaleDateString('es-GT', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('home').innerHTML = `
    <div class="hello">${saludo()}, Kurt · ${esc(fecha.charAt(0).toUpperCase()+fecha.slice(1))}</div>
    <h2>Centro de <em>Control</em></h2>
    <p class="sub">Todas las aplicaciones de la panadería en un solo lugar. Cada una se abre aquí adentro y sigue abierta mientras cambias de una a otra.</p>
    <div class="grid">
      ${APPS.map(a => `
        <button class="card" onclick="go('${esc(a.id)}')">
          <div class="ic">${ico(a.icono)}</div>
          <div class="body">
            <div><h3>${esc(a.nombre)}</h3><p>${esc(a.descripcion)}</p></div>
            <div class="chips">
              ${(a.dispositivos||[]).map(d => `<span class="chip">${esc(d)}</span>`).join('')}
              ${a.hosting ? `<span class="chip h">${esc(a.hosting)}</span>` : ''}
            </div>
          </div>
        </button>`).join('')}
      <div class="card add">
        <div class="ic">${ico('mas')}</div>
        <div class="body"><div><h3>Agregar aplicación</h3><p>Agrega un bloque en <code>apps.json</code> y aparecerá aquí y en el menú.</p></div></div>
      </div>
    </div>
    <div class="tip">${ico('info','i sm')}<span>Si una app no carga dentro del centro, usa «Abrir aparte» en la barra superior.</span></div>`;
}

function pintarTopbar(){
  const tb = document.getElementById('topbar');
  const a = APPS.find(x => x.id === actual);
  if (!a){
    tb.innerHTML = `<div class="ttl"><h1>Inicio</h1></div><div class="acts" style="align-items:center;gap:10px"><button class="btn pri inst${puedeInstalar() ? ' show' : ''}" onclick="instalar()">${ico('instalar','i sm')}<span class="t">Instalar app</span></button><span class="ver">${VERSION}</span></div>`;
    return;
  }
  tb.innerHTML = `
    <div class="ttl">${ico(a.icono)}<div style="min-width:0"><h1>${esc(a.nombre)}</h1><div class="host">${esc(hostDe(a.url))}</div></div></div>
    <div class="acts">
      <button class="btn" onclick="recargar()" title="Recargar">${ico('recargar','i sm')}<span class="t">Recargar</span></button>
      <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener" title="Abrir aparte">${ico('aparte','i sm')}<span class="t">Abrir aparte</span></a>
      <button class="btn pri" onclick="go('')" title="Inicio">${ico('inicio','i sm')}<span class="t">Inicio</span></button>
    </div>`;
}

function crearFrame(a){
  const wrap = document.createElement('div');
  wrap.className = 'frame';
  wrap.innerHTML = `
    <iframe title="${esc(a.nombre)}" allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen; display-capture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="loader"><div class="box">
      <div class="spin"></div>
      <div class="msg">Abriendo ${esc(a.nombre)}…</div>
      <div class="slow"><span>Está tardando más de lo normal. Puede que esta app no permita abrirse dentro del centro.</span>
        <a class="btn pri" href="${esc(a.url)}" target="_blank" rel="noopener">${ico('aparte','i sm')}Abrir aparte</a></div>
    </div></div>`;
  const f = wrap.querySelector('iframe');
  const ld = wrap.querySelector('.loader');
  const lento = setTimeout(() => ld.classList.add('late'), 10000);
  f.addEventListener('load', () => { clearTimeout(lento); ld.classList.add('gone'); wrap.dataset.cargada = '1'; });
  f.src = a.url;
  document.getElementById('frames').appendChild(wrap);
  frames[a.id] = wrap;
  document.querySelector(`.item[data-id="${CSS.escape(a.id)}"]`)?.classList.add('alive');
  return wrap;
}

function mostrar(){
  const a = APPS.find(x => x.id === actual);
  document.getElementById('home').style.display = a ? 'none' : '';
  Object.values(frames).forEach(w => w.classList.remove('on'));
  if (a){
    const w = frames[a.id] || crearFrame(a);
    w.classList.add('on');
    /* Al volver a una app que ya estaba abierta, se le avisa para que traiga
       lo último de su nube (Producción y Agenda sincronizan con Vercel Blob). */
    if (w.dataset.cargada) avisarApp(w);
  }
  document.querySelectorAll('.item, .bottom button').forEach(b => b.classList.toggle('on', (b.dataset.id ?? '') === (a ? a.id : '') && (b.id !== 'nav-home' || !a)));
  document.getElementById('nav-home').classList.toggle('on', !a);
  document.title = (a ? a.nombre + ' · ' : '') + 'Centro de Control';
  pintarTopbar();
}

function avisarApp(w){
  try { w.querySelector('iframe').contentWindow.postMessage({tipo:'cc:mostrar'}, '*'); } catch {}
}

function go(id){
  const a = APPS.find(x => x.id === id);
  if (a && a.modo === 'pestana'){ window.open(a.url, '_blank', 'noopener'); return; }
  location.hash = a ? '#/' + a.id : '#/';
}

function recargar(){
  const a = APPS.find(x => x.id === actual);
  if (!a || !frames[a.id]) return;
  frames[a.id].remove();
  delete frames[a.id];
  mostrar();
}

function leerHash(){
  const id = decodeURIComponent((location.hash.match(/^#\/(.+)$/) || [])[1] || '');
  actual = APPS.some(a => a.id === id) ? id : '';
  guardar('ultima', actual);
  mostrar();
}

/* ---------- Instalar como app ---------- */
let promptInstalar = null;
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const puedeInstalar = () => !instalada() && (!!promptInstalar || esIOS());
function pintarInstalar(){
  const r = document.getElementById('instRail');
  r.innerHTML = ico('instalar') + '<span class="lbl">Instalar app</span>';
  document.querySelectorAll('.inst').forEach(b => b.classList.toggle('show', puedeInstalar()));
}
async function instalar(){
  if (promptInstalar){
    const p = promptInstalar; promptInstalar = null;
    try { p.prompt(); await p.userChoice; } catch {}
    pintarInstalar();
    return;
  }
  const pasos = esIOS()
    ? ['Abre esta página en <b>Safari</b>.', 'Toca <b>Compartir</b> (el cuadro con la flecha hacia arriba).', 'Elige <b>Agregar a inicio</b> y luego <b>Agregar</b>.']
    : /Android/.test(navigator.userAgent)
      ? ['Abre el menú de tres puntos del navegador.', 'Elige <b>Instalar aplicación</b>.']
      : ['Busca el ícono de instalar en la barra de direcciones de Chrome o Edge.', 'O abre el menú del navegador y elige <b>Instalar Centro de Control</b>.'];
  document.getElementById('sheetPasos').innerHTML = pasos.map(x => `<li>${x}</li>`).join('');
  document.getElementById('sheet').classList.add('show');
}
function cerrarSheet(){ document.getElementById('sheet').classList.remove('show'); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; pintarInstalar(); });
window.addEventListener('appinstalled', () => { promptInstalar = null; pintarInstalar(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

(async function iniciar(){
  await cargarRegistro();
  pintarNav();
  pintarInicio();
  pintarInstalar();
  window.addEventListener('hashchange', leerHash);
  leerHash();
})();
</script>
