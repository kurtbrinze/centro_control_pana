<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Centro de Control · Rinze Studio</title>
<link rel="icon" href="/icons/icon.svg?v=5" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=5">
<meta name="apple-mobile-web-app-title" content="Centro">
<script>(function(){var h=document.documentElement,t='oscuro';try{t=localStorage.getItem('rz.tema')||t}catch(_){}h.setAttribute('data-tema',t)})();</script>
<link rel="stylesheet" href="/tema/rinze-tema.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema global Rinze (Grafito & Plata); los valores de respaldo son los mismos. */
  --bg:var(--rz-bg,#0D0F12); --s1:var(--rz-card,#16191E); --s2:var(--rz-elev,#1F232B); --line:var(--rz-card-borde,#262A32); --line2:var(--rz-elev-borde,#323741);
  --tx:var(--rz-tx,#F3F4F6); --tx2:var(--rz-tx2,#9CA3AF); --tx3:var(--rz-tx3,#6B7280);
  --g:var(--rz-act-ind,#E5E7EB); --c:var(--rz-link,#D1D5DB); --grad:var(--rz-pri,#F3F4F6);
  --pri-tx:var(--rz-pri-tx,#0D0F12);
  --rail:92px; --top:56px; --nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

.shell{display:grid;grid-template-columns:var(--rail) 1fr;height:100%}

/* Barra lateral: íconos con descripción pequeña */
.rail{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:calc(14px + var(--safe-t)) 8px 14px;gap:4px;min-height:0}
.brand{display:grid;place-items:center;width:80px;padding:8px 4px;border-radius:12px;margin-bottom:8px;transition:background .15s}
.brand:hover{background:var(--s2)}
.brand svg{width:72px;height:auto;display:block}
.nav-list{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0;width:100%;align-items:center;scrollbar-width:none}
.sep{width:36px;height:1px;background:var(--line);margin:6px 0}
.item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 8px;width:76px;border-radius:12px;color:var(--tx3);position:relative;text-align:center;transition:background .15s,color .15s}
.item:hover{background:var(--s2);color:var(--tx)}
.item.on{background:var(--rz-act,#262A32);color:var(--rz-act-tx,#fff)}
.item.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.item.on svg.i{stroke:currentColor}
.item .lbl{font-size:10.5px;font-weight:500;line-height:1.2;max-width:70px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .dot{position:absolute;top:7px;right:14px;width:6px;height:6px;border-radius:50%;background:var(--rz-ok,#4ADE80);box-shadow:none;opacity:0;transition:opacity .2s}
.item.on .dot{opacity:1}
.rail-foot{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ver{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--g)}

/* Zona principal */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{height:calc(var(--top) + var(--safe-t));padding-top:var(--safe-t)!important;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.topbar .ttl{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .ttl h1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl .host{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .acts{margin-left:auto;display:flex;gap:4px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;color:var(--tx2);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.btn:hover{background:var(--s2);color:var(--tx)}
.btn.pri{background:var(--grad);color:var(--pri-tx);font-weight:600}
.btn.pri:hover{background:var(--rz-pri-hover,#fff);color:var(--pri-tx)}
.view{position:relative;flex:1;min-height:0}

/* Inicio */
.home{position:absolute;inset:0;overflow:auto;padding:36px clamp(18px,4vw,48px) 48px}
.hello{font-size:13px;color:var(--tx2);font-weight:500}
.home h2{font-size:clamp(26px,3.4vw,36px);font-weight:700;letter-spacing:-.02em;margin:6px 0 6px}
.home h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.home .sub{color:var(--tx2);font-size:14px;max-width:560px;line-height:1.6}
.home{display:flex;flex-direction:column;padding-bottom:0}
.home > .hoy{align-self:flex-start}
.grid{--cols:3;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:20px;grid-auto-flow:row dense;gap:12px;margin-top:22px;max-width:1400px}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:var(--rz-r-card,12px);padding:20px;box-shadow:var(--rz-sombra,none);display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.c-hd{display:flex;align-items:center;gap:10px;flex:none}
.c-ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line2);transition:border-color .2s,transform .2s}
.c-ic svg.i{stroke:currentColor}
.c-ic:hover{border-color:var(--g);transform:translateY(-1px)}
.c-tt{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
.c-tt b{font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.c-tt:hover b{color:var(--g)}
.c-tt span{font-size:11.5px;color:var(--tx3);margin-top:2px}
.c-tt span.viejo{color:var(--rz-warn,#FBBF24)}
.c-ir{margin-left:auto;font-size:12px;font-weight:500;color:var(--rz-link,#D1D5DB);padding:6px 8px;border-radius:8px;white-space:nowrap}
.c-ir:hover{background:var(--s2)}
.c-bd{display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:var(--tx2);min-width:0;min-height:0;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;padding-right:2px}
.c-vacio{padding:14px;border:1px dashed var(--line2);border-radius:12px;color:var(--tx3);font-size:12.5px;line-height:1.5}
.c-vacio b{color:var(--tx2);font-weight:500}
.dia-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:8px}
.dia-lbl .pill{letter-spacing:0;text-transform:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--rz-r-badge,6px);border:1px solid var(--rz-neu-borde,rgba(156,163,175,.25));color:var(--rz-neu,#9CA3AF);background:var(--rz-neu-bg,rgba(156,163,175,.1));white-space:nowrap}
.pill.g{color:var(--rz-ok,#4ADE80);border-color:var(--rz-ok-borde);background:var(--rz-ok-bg)}
.pill.c{color:var(--tx);border-color:var(--line2);background:var(--s2)}
.pill.a{color:var(--rz-warn,#FBBF24);border-color:var(--rz-warn-borde);background:var(--rz-warn-bg)}
.pill.r{color:var(--rz-crit,#F87171);border-color:var(--rz-crit-borde);background:var(--rz-crit-bg)}
.big{display:flex;gap:10px;flex-wrap:wrap}
.big > div{flex:1 1 96px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.big small{display:block;font-size:11px;color:var(--tx3);font-weight:500}
.big strong{display:block;font-size:17px;font-weight:700;color:var(--tx);margin-top:2px;font-variant-numeric:tabular-nums}
.big strong em{font-style:normal;font-size:12px;font-weight:500;color:var(--tx3);margin-left:3px}
.big .lin{font-size:11.5px;color:var(--tx3);margin-top:3px}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .f{display:flex;gap:10px;align-items:baseline;min-width:0}
.lst .f .k{color:var(--tx);font-weight:500;white-space:nowrap}
.lst .f .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst .f .n{margin-left:auto;color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tur{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.tur span b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.tur span.pm{color:var(--tx3)}
details.cl summary{cursor:pointer;font-size:12px;color:var(--c);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.cl summary::-webkit-details-marker{display:none}
details.cl summary::before{content:'›';display:inline-block;transition:transform .2s}
details.cl[open] summary::before{transform:rotate(90deg)}
details.cl .cls{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:12px}
details.cl .cls b{color:var(--tx);font-weight:500}
.tb{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
.tb th{font-size:10px;color:var(--tx3);font-weight:600;text-align:left;padding:2px 6px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tb td{padding:4px 6px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb th:first-child,.tb td:first-child{padding-left:0}
.tb th:last-child,.tb td:last-child{padding-right:0}
.tb .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb td.k{color:var(--tx);font-weight:600;white-space:nowrap}
.tb td.b{color:var(--tx);font-weight:700}
.tb td.el{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 16px;align-items:start}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.sts > div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:0}
.sts small{display:block;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sts b{display:block;font-size:14px;color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-t{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:2px}
.mini{font-size:12px;color:var(--tx3);display:flex;flex-wrap:wrap;gap:4px 14px}
.mini b{color:var(--tx2);font-weight:600}
.home-pie{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:10px;padding:22px 0 18px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tip{font-size:11.5px;color:var(--tx3);display:flex;gap:8px;align-items:center;margin-right:auto}
.btn-add{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);color:var(--tx);font-size:13px;font-weight:500;transition:border-color .2s}
.btn-add svg.i{stroke:currentColor}
.btn-add:hover{border-color:var(--g)}
.sheet code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--g)}

/* Apps embebidas */
.frames{position:absolute;inset:0;pointer-events:none}
.frame{position:absolute;inset:0;visibility:hidden}
.frame.on{visibility:visible;pointer-events:auto}
.frame iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .3s}
.loader.gone{opacity:0;pointer-events:none}
.loader .box{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--s2);border-top-color:var(--g);border-right-color:var(--c);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader .msg{font-size:14px;color:var(--tx2)}
.loader .slow{display:none;flex-direction:column;align-items:center;gap:12px;font-size:13px;color:var(--tx3);max-width:320px}
.loader.late .slow{display:flex}

/* Tablero: mover y cambiar tamaño */
.c-mover,.c-tam{display:none}
.grid.editando .card{border-style:dashed;border-color:var(--line2);user-select:none}
.grid.editando .card .c-bd{pointer-events:none}
.grid.editando .c-mover{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;color:var(--tx2);cursor:grab;touch-action:none;background:var(--s2)}
.grid.editando .c-mover:active{cursor:grabbing}
.grid.editando .c-ir{display:none}
.grid.editando .c-tam{display:block;position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;z-index:2}
.grid.editando .c-tam::after{content:"";position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-right:2px solid var(--g);border-bottom:2px solid var(--g);border-radius:0 0 3px 0}
.card.arrastrando{box-shadow:0 0 0 2px var(--g),0 16px 40px rgba(0,0,0,.5);z-index:5;opacity:.92}
.card .c-medida{display:none;position:absolute;right:28px;bottom:6px;font-size:10.5px;font-family:'JetBrains Mono',monospace;color:var(--g)}
.card.arrastrando .c-medida{display:block}
.btn-org{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);color:var(--tx2);font-size:13px;font-weight:500}
.btn-org:hover{color:var(--tx);border-color:var(--tx3)}
.btn-org.on{background:var(--grad);color:var(--pri-tx);border-color:transparent;font-weight:600}
.btn-org.on svg.i{stroke:var(--pri-tx)}
.btn-org svg.i{stroke:currentColor}
.btn-org[hidden]{display:none}
body.organizando #navList .item{outline:1px dashed var(--line2);outline-offset:-2px;cursor:grab;touch-action:none;user-select:none}
body.organizando #navList .item.moviendo{outline:2px solid var(--g);background:var(--rz-act,#262A32);cursor:grabbing}
body.organizando #navList::before{content:'Arrastra para ordenar';display:block;font-size:9.5px;color:var(--g);text-align:center;padding:0 4px 4px}

/* Hoy (inicio) */
.hoy{margin-top:22px;display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--tx2);text-align:left;transition:border-color .2s}
.hoy:hover{border-color:var(--line2)}
.hoy svg.i{stroke:currentColor}
.hoy b{color:var(--tx);font-weight:600}
.hoy .wm{color:var(--g);font-family:'JetBrains Mono',monospace;font-weight:500}
.hoy .sepv{width:1px;height:16px;background:var(--line2)}
.hoy .ver-cal{color:var(--c);font-weight:500}
.cal-movil,.tema-movil{display:none}

/* Calendario flotante */
.cal{position:fixed;z-index:60;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px);display:none;flex-direction:column;background:var(--s1);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.cal.show{display:flex}
.cal-hd{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.cal.arr .cal-hd{cursor:grabbing}
.cal-hd .tt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.cal-hd .tt svg.i{stroke:currentColor}
.cal-yr{display:flex;align-items:center;gap:2px;margin-left:6px}
.cal-yr b{font-size:15px;font-weight:600;min-width:46px;text-align:center}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--tx2)}
.ib:hover{background:var(--s2);color:var(--tx)}
.seg{margin-left:auto;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:500;color:var(--tx2)}
.seg button.on{background:var(--s2);color:var(--tx)}
.seg button.on.w{color:var(--g)}
.cal-hoy{font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);color:var(--tx2)}
.cal-hoy:hover{color:var(--tx);border-color:var(--tx3)}
.cal-bd{overflow:auto;padding:14px 16px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px}
.mes h4{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--tx)}
.mes.act h4{color:var(--g)}
.mes table{border-collapse:collapse;width:100%;font-size:11px;font-variant-numeric:tabular-nums}
.mes th{font-weight:500;color:var(--tx3);padding:2px 0;text-align:center}
.mes td{text-align:center;padding:0;height:21px;color:var(--tx2)}
.mes td.n{color:var(--tx3);font-family:'JetBrains Mono',monospace;font-size:10px;width:20px;border-right:1px solid var(--line)}
.cal.wm .mes td.n{color:var(--g);opacity:.8}
.mes td.d{cursor:pointer;border-radius:6px}
.mes td.d:hover{background:var(--s2);color:var(--tx)}
.mes td.fin{color:var(--tx3)}
.mes tr.semhoy td.d{background:color-mix(in srgb,var(--tx) 5%,transparent)}
.mes td.hoyd{background:var(--grad)!important;color:var(--pri-tx);font-weight:700}
.mes td.sel{outline:1.5px solid var(--c);outline-offset:-1.5px;color:var(--tx)}
.cal-ft{padding:10px 16px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.cal-ft b{color:var(--tx);font-weight:600}
.cal-ft .wm{color:var(--g);font-family:'JetBrains Mono',monospace}
.cal-escudo{position:fixed;inset:0;z-index:59;display:none}
.cal.arr ~ .cal-escudo{display:block}
@media (max-width:1100px){.cal-bd{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){
  .cal-movil,.tema-movil{display:inline-flex}
  #calRail{display:none}
  .cal{left:0!important;top:0!important;width:100vw;height:100dvh;max-height:none;border-radius:0;border:0}
  .cal-hd{cursor:default;padding-top:calc(10px + var(--safe-t));flex-wrap:wrap}
  .seg{margin-left:0}
  .cal-bd{grid-template-columns:1fr 1fr;gap:14px}
  .cal-ft{padding-bottom:calc(12px + var(--safe-b))}
}

/* Instalar */
.inst{display:none}
.inst.show{display:inline-flex}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.7);display:none;align-items:flex-end;justify-content:center;padding:16px}
.sheet.show{display:flex}
.sheet .pan{background:var(--s1);border:1px solid var(--line2);border-radius:18px;max-width:420px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;margin-bottom:var(--safe-b)}
.sheet h3{font-size:17px;font-weight:600}
.sheet ol{padding-left:20px;color:var(--tx2);font-size:14px;line-height:1.7}
.sheet b{color:var(--tx)}

/* Navegación inferior (celular) */
.bottom{display:none}

/* Celular: navegación abajo */
@media (max-width:640px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-bottom:calc(var(--nav) + var(--safe-b))}
  .topbar{padding:0 8px 0 14px;gap:8px}
  .topbar .btn .t{display:none}
  .topbar .btn{padding:0 10px}

<script>
const VERSION = 'V.20';

/* Copia de respaldo del registro. La fuente principal es apps.json. */
const RESPALDO = [
  {id:'produccion',nombre:'Control Producción',corto:'Producción',descripcion:'Cálculo y control de la producción diaria.',url:'/apps/produccion/',icono:'produccion',dispositivos:['Laptop','Tablet'],hosting:'Vercel',modo:'embebida'},
  {id:'pedidos',nombre:'Pedidos',corto:'Pedidos',descripcion:'Pedidos y preventa: captura, resumen del día y lo que suma a producción.',url:'/apps/pedidos/',icono:'pedidos',dispositivos:['Laptop','Tablet','Celular'],hosting:'Vercel',modo:'embebida'},
  {id:'entregas',nombre:'Entregas a CEDI',corto:'Entregas',descripcion:'Formularios, órdenes de compra, citas y QR para el CEDI.',url:'/apps/cd/',icono:'entregas',dispositivos:['Laptop'],hosting:'GitHub',modo:'embebida'},
  {id:'agenda',nombre:'Agenda',corto:'Agenda',descripcion:'Citas, tareas y pendientes de la panadería.',url:'https://agenda-chi-wheat.vercel.app/',icono:'agenda',precargar:true,dispositivos:['Laptop','Celular'],hosting:'Vercel',modo:'embebida'},
  {id:'desviaciones',nombre:'Desviaciones',corto:'Desviaciones',descripcion:'Análisis de lo pedido contra lo entregado.',url:'/apps/desviaciones/',icono:'desviaciones',dispositivos:['Laptop'],hosting:'GitHub',modo:'embebida'},
  {id:'rutas',nombre:'Resumen Rutas Supermercados',corto:'Rutas Súper',descripcion:'Resumen AM/PM de rutas para WhatsApp, cadenas, cambios y verificación.',url:'/apps/rutas/',icono:'rutas',dispositivos:['Laptop'],hosting:'Vercel',modo:'embebida'}
];

const LOGO = `<svg viewBox="40 30 860 290" role="img" aria-label="Rinze Studio"><use href="#rinzeMark"/><g transform="translate(315, 45)"><text x="0" y="138" font-family="'Inter','Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="136" font-weight="600" fill="var(--rz-tx,#F3F4F6)" letter-spacing="-2">Rinze</text><text x="6" y="218" font-family="'Inter','Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="52" font-weight="500" fill="url(#studioTextGrad)" letter-spacing="22">STUDIO</text></g></svg>`;

const ICONOS = {
  inicio:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  produccion:'<path d="M5 13.5A2.5 2.5 0 0 1 4 9.5C4 6.5 7.6 4 12 4s8 2.5 8 5.5a2.5 2.5 0 0 1-1 4V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M9 8.5l1 2M13 8l1 2"/>',
  entregas:'<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3.5V16h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  desviaciones:'<path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/><path d="M3 21h18"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h2M14 14h2M8 17.5h2"/>',
  inventario:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  documento:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  camara:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  pedidos:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M8.5 11l1.5 1.5 3-3"/><path d="M8.5 16.5h7"/>',
  rutas:'<circle cx="6" cy="5.5" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.5 5.5H16a3.25 3.25 0 0 1 0 6.5H8a3.25 3.25 0 0 0 0 6.5h7.5"/>',
  grafica:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  caja:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 14h6"/>',
  recargar:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  aparte:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/>',
  cerrar:'<path d="M6 6l12 12M18 6L6 18"/>',
  izq:'<path d="M15 6l-6 6 6 6"/>',
  der:'<path d="M9 6l6 6-6 6"/>',
  mover:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  organizar:'<rect x="3" y="3" width="8" height="11" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="16" width="8" height="5" rx="1.5"/>',
  instalar:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  luna:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
const ico = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n]||ICONOS.caja}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hostDe = u => { try { const x = new URL(u, location.href); return x.origin === location.origin ? x.host + x.pathname.replace(/\/$/, '') : x.host; } catch { return u; } };

let APPS = [];
let actual = '';
const frames = {};

const guardar = (k,v) => { try { localStorage.setItem('cc.'+k, v); } catch {} };
const leer = k => { try { return localStorage.getItem('cc.'+k); } catch { return null; } };

async function cargarRegistro(){
  try {
    const r = await fetch('apps.json', {cache:'no-store'});
    if (!r.ok) throw 0;
    const j = await r.json();
    APPS = (j.apps || j).filter(a => a && a.id && a.url);
  } catch { APPS = RESPALDO; }
}

function pintarNav(){
  document.getElementById('nav-home').innerHTML = ico('inicio') + '<span class="lbl">Inicio</span>';
  pintarMenu();
  document.getElementById('ver').textContent = VERSION;
  document.getElementById('logoRail').outerHTML = LOGO;
}
/* Botones de apps de la barra (y de la barra de abajo en el celular), en el
   orden que se eligió con «Organizar» (tablero.menu). */
function appsMenu(){
  const orden = (typeof tablero !== 'undefined' && tablero.menu) || [];
  const ids = APPS.map(a => a.id);
  return orden.filter(id => ids.includes(id)).concat(ids.filter(id => !orden.includes(id))).map(id => APPS.find(a => a.id === id));
}
function pintarMenu(){
  const L = appsMenu();
  document.getElementById('navList').innerHTML = L.map(a =>
    `<button class="item" data-id="${esc(a.id)}" data-tip="${esc(a.nombre)}" onclick="go('${esc(a.id)}')">${ico(a.icono)}<span class="lbl">${esc(a.nombre)}</span><span class="dot"></span></button>`
  ).join('');
  document.getElementById('bottom').innerHTML =
    `<button data-id="" onclick="go('')">${ico('inicio')}<span class="lbl">Inicio</span></button>` +
    L.map(a => `<button data-id="${esc(a.id)}" onclick="go('${esc(a.id)}')">${ico(a.icono)}<span class="lbl">${esc(a.corto || a.nombre)}</span></button>`).join('');
  document.querySelectorAll('.item[data-id], .bottom button').forEach(b => b.classList.toggle('on', (b.dataset.id ?? '') === actual));
}

function saludo(){
  const h = new Date().getHours();
  return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
}

function pintarInicio(){
  const fecha = new Date().toLocaleDateString('es-GT', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('home').innerHTML = `
    <div class="hello">${saludo()}, Kurt · ${esc(fecha.charAt(0).toUpperCase()+fecha.slice(1))}</div>
    <h2>Centro de <em>Control</em></h2>
    <button class="hoy" onclick="calAbrir()">${hoyResumen()}</button>
    <div class="grid" id="tarjetas">${APPS.map(a => `<article class="card" id="card-${esc(a.id)}">${tarjeta(a)}</article>`).join('')}</div>
    <div class="home-pie">
      <div class="tip">${ico('info','i sm')}<span>Si una app no carga dentro del centro, usa «Abrir aparte» en la barra superior.</span></div>
      <button class="btn-org" id="btnRest" onclick="restablecerTablero()" hidden>${ico('recargar','i sm')}<span>Restablecer</span></button>
      <button class="btn-org" id="btnOrg" onclick="organizar()">${ico('organizar','i sm')}<span>Organizar</span></button>
      <button class="btn-add" onclick="agregarApp()">${ico('mas','i sm')}Agregar aplicación</button>
    </div>`;
  requestAnimationFrame(aplicarTablero);
}

/* ---------- Tarjetas con el resumen de cada app ----------
   Cada app deja su resumen como { v, app, actualizado, datos }: las que el
   centro sirve desde su propio sitio lo escriben en localStorage
   (cc.insight.<id>); la Agenda, que vive en otro sitio, lo manda por
   postMessage y el centro lo guarda igual. La tarjeta sólo lo muestra. */
const leerInsight = id => { try { return JSON.parse(localStorage.getItem('cc.insight.' + id) || 'null'); } catch { return null; } };
const DIAC = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const isoF = iso => { const [y, m, d] = String(iso).split('-').map(Number); return fecha(y, m - 1, d); };
const hoyISO = () => { const h = new Date(); return h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0') + '-' + String(h.getDate()).padStart(2, '0'); };
function diaTxt(iso){
  const f = isoF(iso), dif = Math.round((f - isoF(hoyISO())) / DIA);
  const base = DIAC[f.getDay()] + ' ' + String(f.getDate()).padStart(2, '0') + '/' + String(f.getMonth() + 1).padStart(2, '0');
  return dif === 0 ? 'Hoy · ' + base : dif === 1 ? 'Mañana · ' + base : dif === -1 ? 'Ayer · ' + base : base;
}
function haceTxt(isoDT){
  if (!isoDT) return { t: 'Sin datos todavía', viejo: true };
  const d = new Date(isoDT), h = new Date();
  const hm = d.toLocaleTimeString('es-GT', { hour: 'numeric', minute: '2-digit' });
  const dias = Math.round((fecha(h.getFullYear(), h.getMonth(), h.getDate()) - fecha(d.getFullYear(), d.getMonth(), d.getDate())) / DIA);
  return { t: 'Actualizado ' + (dias === 0 ? 'hoy ' + hm : dias === 1 ? 'ayer ' + hm : d.toLocaleDateString('es-GT', { day: 'numeric', month: 'short' })), viejo: dias > 0 };
}
const num = (v, d = 1) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('es-GT', { maximumFractionDigits: d });
const pctT = (v, d = 1) => v == null || !isFinite(v) ? '—' : num(v * 100, d) + '%';

function tarjeta(a){
  const ins = leerInsight(a.id);
  const h = haceTxt(ins && ins.actualizado);
  const cab = `<div class="c-hd">
      <span class="c-mover" data-mover="${esc(a.id)}" title="Arrastrar para mover">${ico('mover','i sm')}</span>
      <button class="c-ic" onclick="go('${esc(a.id)}')" aria-label="Abrir ${esc(a.nombre)}" title="Abrir ${esc(a.nombre)}">${ico(a.icono)}</button>
      <button class="c-tt" onclick="go('${esc(a.id)}')"><b>${esc(a.nombre)}</b><span class="${h.viejo ? 'viejo' : ''}">${esc(h.t)}</span></button>
      <button class="c-ir" onclick="go('${esc(a.id)}')">Abrir ›</button>
    </div>`;
  const r = RESUMENES[a.id];
  let cuerpo;
  try { cuerpo = ins && r ? r(ins.datos || {}) : vacio(a); } catch { cuerpo = vacio(a); }
  return cab + `<div class="c-bd">${cuerpo}</div><span class="c-medida"></span><span class="c-tam" data-tam="${esc(a.id)}" title="Arrastrar para cambiar el tamaño"></span>`;
}
const vacio = a => `<div class="c-vacio">${esc(a.descripcion || '')}<br><b>Abre ${esc(a.nombre)} una vez desde el centro</b> y aquí aparecerá su resumen del día.</div>`;

const RESUMENES = {
  pedidos(d){
    const [hoy, man] = d.dias || [];
    /* Por día: indicadores en una fila y las claves en tabla (clave · unidades · bolsas). */
    const bloque = (x) => {
      if (!x) return '';
      const prods = x.prods || (x.top || []).map(t => ({ prod: t.prod, uni: 0, bol: t.bolsas }));
      const cab = `<div class="dia-lbl">${esc(diaTxt(x.fecha))}${x.suman ? `<span class="pill a">${num(x.suman, 0)} suman al sugerido</span>` : ''}</div>`;
      if (!x.pedidos) return `<div class="lst">${cab}<div class="mini"><span>Sin pedidos</span></div></div>`;
      const st = (t, v) => `<div><small>${t}</small><b>${v}</b></div>`;
      const stats = `<div class="sts">${st('Pedidos', num(x.pedidos, 0))}${st('Clientes', num(x.clientes, 0))}${st('Bolsas', num(x.bolsas, 0))}${x.valor ? st('Valor', 'Q' + num(x.valor, 0)) : ''}${x.preparados ? st('Prep.', num(x.preparados, 0)) : ''}${x.entregados ? st('Desp.', num(x.entregados, 0)) : ''}</div>`;
      const max = 12, ver = prods.slice(0, max);
      /* Dos columnas de tabla cuando hay varias claves. */
      const mitad = ver.length > 4 ? Math.ceil(ver.length / 2) : ver.length;
      const tabla = (l) => l.length ? `<table class="tb"><thead><tr><th>Clave</th><th class="r">Unid.</th><th class="r">Bolsas</th></tr></thead><tbody>${l.map(t => `<tr><td class="k">${esc(t.prod)}</td><td class="r">${t.uni ? num(t.uni, 0) : '—'}</td><td class="r b">${num(t.bol, 0)}</td></tr>`).join('')}</tbody></table>` : '';
      return `<div class="lst">${cab}${stats}<div class="tb2">${tabla(ver.slice(0, mitad))}${tabla(ver.slice(mitad))}</div>${prods.length > max ? `<div class="mini"><span>+${prods.length - max} claves más</span></div>` : ''}</div>`;
    };
    return `<div class="dia-lbl"><span class="pill c">${num(d.pendientes, 0)} por despachar</span>${d.vencidos ? `<span class="pill r">${num(d.vencidos, 0)} vencidos sin cerrar</span>` : ''}</div>${bloque(hoy)}${bloque(man)}`;
  },
  rutas(d){
    const t = (x, l) => x ? `<div><small>${l} · ${esc(diaTxt(x.fecha))}</small><strong>${num(x.unidades, 0)}<em>u.</em></strong><div class="lin">${x.rutas} ${x.rutas === 1 ? 'ruta' : 'rutas'} en la imagen</div></div>` : '';
    if (!d.am && !d.pm) return `<div class="c-vacio">Todavía no se han cargado crudos.</div>`;
    return `<div class="dia-lbl">Corte ${esc(diaTxt(d.corteDia))} ${esc(d.corteHora || '')}${d.sinVerif ? `<span class="pill r">${num(d.sinVerif, 0)} líneas sin verificar</span>` : ''}${d.cambios ? `<span class="pill a">${num(d.cambios, 0)} u. en cambios</span>` : ''}</div><div class="big">${t(d.am, 'Rutas AM')}${t(d.pm, 'Rutas PM')}</div>`;
  },
  produccion(d){
    const plantas = (d.plantas || []).filter(p => p.decidido > 0 || p.sugerido > 0);
    if (!plantas.length) return `<div class="dia-lbl">${esc(diaTxt(d.fecha))}</div><div class="c-vacio">Todavía no hay producción decidida para este día.</div>`;
    const tot = `<div class="big">${plantas.map(p => `<div><small>${esc(p.nombre)}</small><strong>${num(p.decidido || p.sugerido)}<em>QQ${p.decidido ? '' : ' sug.'}</em></strong>${p.tope ? `<div class="lin">de ${num(p.tope)} QQ de capacidad</div>` : ''}</div>`).join('')}</div>`;
    const turnos = plantas.map(p => {
      const ts = (p.turnos || []).filter(t => t.usado > 0);
      if (!ts.length) return '';
      return `<div class="lst"><div class="f"><span class="k">${esc(p.nombre)}</span></div><div class="tur">${ts.map(t => `<span class="${t.momento === 'PM' ? 'pm' : ''}">${esc(t.nombre)} <b>${num(t.usado, 2)}</b></span>`).join('')}</div></div>`;
    }).join('');
    /* Claves por turno en tabla: turno · clave · QQ. */
    const filasCl = plantas.flatMap(p => (p.turnos || []).filter(t => t.claves && t.claves.length).flatMap(t => t.claves.map((c, i) => `<tr><td class="k">${i ? '' : esc(t.nombre)}</td><td>${esc(c.clave)}</td><td class="r b">${num(c.qq, 2)}</td></tr>`))).join('');
    const claves = filasCl ? `<table class="tb"><thead><tr><th>Turno</th><th>Clave</th><th class="r">QQ</th></tr></thead><tbody>${filasCl}</tbody></table>` : '';
    return `<div class="dia-lbl">${esc(diaTxt(d.fecha))}<span class="pill g">${num(d.decidido)} QQ decididos</span>${d.faltantes ? `<span class="pill r">${d.faltantes} con faltante</span>` : ''}</div>${tot}${turnos}${claves ? `<details class="cl"><summary>Ver claves por turno</summary><div class="cls">${claves}</div></details>` : ''}`;
  },
  entregas(d){
    if (d.estado === 'sin-vincular') return `<div class="c-vacio">Vinculá el <b>Control OC FBD POD</b> en el Inicio de Entregas para ver aquí las próximas entregas.</div>`;
    if (d.estado !== 'ok') return `<div class="c-vacio">Entregas no pudo leer el Control OC. Ábrela y tocá ↻ en Próximas entregas.</div>`;
    if (!(d.dias || []).length) return `<div class="c-vacio">No hay entregas próximas en el Control OC.</div>`;
    const EST = { hoy: ['c', 'Hoy'], calculado: ['a', 'Calculado'], 'por-calcular': ['r', 'Por calcular'], 'sin-cita': ['', 'Sin cita'] };
    const pend = d.dias.slice(0, 2).flatMap(x => x.entregas).filter(e => e.estado === 'por-calcular').length;
    return (pend ? `<div class="dia-lbl"><span class="pill r">${pend} por calcular en los próximos días</span></div>` : '') + d.dias.map(x => `
      <div class="lst"><div class="dia-lbl">${esc(diaTxt(x.fecha))}</div>
      <table class="tb"><thead><tr><th>Proveedor</th><th>OC</th><th>Cita</th><th class="r">Estado</th></tr></thead><tbody>
      ${x.entregas.map(e => { const s = EST[e.estado] || ['', e.estado]; return `<tr><td class="k el" title="${esc(e.prov)}">${esc(e.prov)}</td><td style="white-space:nowrap">${esc(e.oc)}</td><td style="white-space:nowrap">${e.cita ? esc(e.cita) : '—'}</td><td class="r"><span class="pill ${s[0]}">${esc(s[1])}</span></td></tr>`; }).join('')}</tbody></table></div>`).join('');
  },
  agenda(d){
    const [hoy, prox] = d.dias || [];
    if (!hoy) return vacio(APPS.find(a => a.id === 'agenda'));
    const aus = (x) => x.ausencias.map(a => esc(a.nombre) + ' <span style="color:var(--tx3)">(' + esc(a.tipo) + ')</span>').join(', ');
    const bloque = (x, completo) => {
      const cab = `<div class="dia-lbl">${esc(diaTxt(x.fecha))}${x.feriado ? `<span class="pill a">${esc(x.feriado)}</span>` : ''}${x.sinDespacho && !x.rutas.length ? '<span class="pill">Sin despacho</span>' : ''}</div>`;
      if (x.sinDespacho && !x.rutas.length) return `<div class="lst">${cab}</div>`;
      /* Rutas: cliente · camión · equipo · parrillas. */
      const rutas = completo && x.rutas.length ? `<table class="tb"><thead><tr><th>Ruta</th><th>Camión</th><th>Equipo</th>${x.rutas.some(r => r.parrillas) ? '<th class="r">Parr.</th>' : ''}</tr></thead><tbody>
        ${x.rutas.map(r => { const cs = r.camiones || []; const eq = cs.map(c => [c.chofer, ...(c.ayudantes || [])].filter(Boolean).join(' + ')).join(' / ');
          return `<tr><td class="k">${esc(r.clientes || '—')}</td><td style="white-space:nowrap">${cs.map(c => esc(c.camion)).join(' / ')}</td><td class="el" title="${esc(eq)}">${esc(eq)}</td>${x.rutas.some(q => q.parrillas) ? `<td class="r b">${r.parrillas ? esc(r.parrillas) : ''}</td>` : ''}</tr>`; }).join('')}</tbody></table>` : '';
      /* Empaques: producto · cantidad, en dos columnas. */
      const emp = completo && x.empaques.length ? (() => {
        const l = x.empaques, m = l.length > 3 ? Math.ceil(l.length / 2) : l.length;
        const t = (z) => z.length ? `<table class="tb"><thead><tr><th>Empaque</th><th class="r">Cant.</th></tr></thead><tbody>${z.map(e => `<tr><td class="k">${esc(e.prod)}</td><td class="r b">${esc(e.cant)}</td></tr>`).join('')}</tbody></table>` : '';
        return `<div class="tb2">${t(l.slice(0, m))}${t(l.slice(m))}</div>`;
      })() : '';
      /* Resumen del día como filas de dato. */
      const filas = [
        ['Rutas', `<b style="color:var(--tx)">${x.rutas.length}</b>`],
        !completo && x.empaques.length ? ['Empaques', x.empaques.map(e => esc(e.prod) + ' <b style="color:var(--tx)">' + esc(e.cant) + '</b>').join(' · ')] : null,
        ['Personal', `<b style="color:var(--tx)">${x.personal}</b> asignadas`],
        x.ausencias.length ? ['Ausencias', aus(x)] : null,
        x.reuniones.length ? ['Reuniones', x.reuniones.map(m => esc((m.hora ? m.hora + ' ' : '') + m.titulo)).join(' · ')] : null,
        completo && x.notas.length ? ['Notas', x.notas.slice(0, 3).map(esc).join(' · ')] : null,
      ].filter(Boolean);
      const datos = `<table class="tb"><tbody>${filas.map(([k, v]) => `<tr><td class="k" style="width:1%;color:var(--tx3);font-weight:500">${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>`;
      return `<div class="lst">${cab}${rutas}${emp}${datos}</div>`;
    };
    return bloque(hoy, true) + (prox ? bloque(prox, false) : '');
  },
  desviaciones(d){
    const fr = (d.fill || []).map(f => {
      const bajo = f.valor != null && f.valor < f.objetivo;
      const fl = f.valor != null && f.anterior != null ? (f.valor > f.anterior ? '▲' : f.valor < f.anterior ? '▼' : '') : '';
      return `<div><small>Fill Rate ${esc(f.nombre)}</small><strong style="${bajo ? 'color:var(--rz-crit,#F87171)' : ''}">${pctT(f.valor)}${fl ? `<em>${fl}</em>` : ''}</strong><div class="lin">objetivo ${pctT(f.objetivo, 0)}${f.anterior != null ? ' · antes ' + pctT(f.anterior) : ''}</div></div>`;
    }).join('');
    const al = d.alertas || { total: 0, top: [] };
    const oc = d.ocManuales || { combinaciones: 0, unidades: 0 };
    const top = (al.top || []).map(c => `<div class="f"><span class="pill ${c.estado === 'rojo' ? 'r' : 'a'}">${c.estado === 'rojo' ? 'Rojo' : 'Amarillo'}</span><span class="v">${esc(c.tienda)} ${esc(c.nombre)} · <b style="color:var(--tx);font-weight:500">${esc(c.clave)}</b></span><span class="n">${num(c.riesgo, 0)} u</span></div>`).join('');
    const vf = d.ventaFcst && d.ventaFcst.fcst ? (d.ventaFcst.venta - d.ventaFcst.fcst) / d.ventaFcst.fcst : null;
    const mini = [
      d.ventaFcst ? `<span>Venta vs FCST sem ${esc(d.ventaFcst.semana)}: <b>${vf == null ? 'sin FCST' : (vf > 0 ? '+' : '') + pctT(vf)}</b></span>` : '',
      d.evento ? `<span>Próximo evento: <b>${esc(d.evento.nombres.join(', '))}</b> sem ${esc(d.evento.semana)} (+${num(d.evento.pct * 100, 0)}%)</span>` : '',
    ].filter(Boolean).join('');
    return `<div class="dia-lbl">Semana Walmart ${esc(d.semana || '')}${d.frSemana ? ` · Fill Rate ${esc(d.frSemana)}` : ''}</div>
      <div class="big">${fr}<div><small>OC manuales de refuerzo</small><strong>${num(oc.combinaciones, 0)}<em>comb.</em></strong><div class="lin">${num(oc.unidades, 0)} u en riesgo</div></div></div>
      <div class="lst"><div class="dia-lbl">${num(al.total, 0)} con alerta<span class="pill r">${num(al.rojo, 0)} rojo</span><span class="pill a">${num(al.amarillo, 0)} amarillo</span></div>${top || '<div class="mini">Sin alertas.</div>'}</div>
      ${mini ? `<div class="mini">${mini}</div>` : ''}`;
  },
};

/* ---------- Tablero: orden y tamaño de las tarjetas ----------
   Cuadrícula de columnas (según el ancho) y filas de 20 px. Cada tarjeta
   ocupa c columnas y r filas; la cuadrícula acomoda las demás, así que
   nunca se enciman. En «Organizar» se mueven con el asa de puntos y se les
   cambia el tamaño desde la esquina inferior derecha. Se guarda por equipo. */
const FILA = 20, HUECO = 12, MIN_R = 7, MAX_R = 40;
const TAM_DEF = { c: 1, r: 11 };
let tablero = (() => { try { return JSON.parse(leer('tablero') || 'null') || {}; } catch { return {}; } })();
tablero.orden = tablero.orden || []; tablero.tam = tablero.tam || {}; tablero.menu = tablero.menu || [];
const guardarTablero = () => guardar('tablero', JSON.stringify(tablero));
function ordenApps(){
  const ids = APPS.map(a => a.id);
  return tablero.orden.filter(id => ids.includes(id)).concat(ids.filter(id => !tablero.orden.includes(id)));
}
function columnas(){
  const g = document.getElementById('tarjetas');
  const w = g ? g.clientWidth : 900;
  return Math.max(1, Math.min(4, Math.floor((w + HUECO) / (300 + HUECO))));
}
function aplicarTablero(){
  const g = document.getElementById('tarjetas'); if (!g) return;
  const cols = columnas();
  g.style.setProperty('--cols', cols);
  ordenApps().forEach((id, i) => {
    const el = document.getElementById('card-' + id); if (!el) return;
    const t = Object.assign({}, TAM_DEF, tablero.tam[id]);
    el.style.order = i;
    el.style.gridColumn = 'span ' + Math.min(t.c, cols);
    el.style.gridRow = 'span ' + t.r;
  });
}
function organizar(forzar){
  const g = document.getElementById('tarjetas'), b = document.getElementById('btnOrg');
  const on = typeof forzar === 'boolean' ? forzar : !g.classList.contains('editando');
  g.classList.toggle('editando', on);
  b.classList.toggle('on', on);
  b.querySelector('span').textContent = on ? 'Listo' : 'Organizar';
  document.getElementById('btnRest').hidden = !on;
  document.body.classList.toggle('organizando', on);
}
(function arrastresTablero(){
  let op = null;
  document.addEventListener('pointerdown', e => {
    const g = document.getElementById('tarjetas');
    if (!g || !g.classList.contains('editando')) return;
    const mv = e.target.closest('[data-mover]'), tm = e.target.closest('[data-tam]');
    if (!mv && !tm) return;
    e.preventDefault();
    const id = (mv || tm).dataset.mover || (mv || tm).dataset.tam;
    const el = document.getElementById('card-' + id);
    const r = el.getBoundingClientRect();
    const colW = (g.clientWidth - HUECO * (columnas() - 1)) / columnas();
    op = { tipo: mv ? 'mover' : 'tam', id, el, x: e.clientX, y: e.clientY, w: r.width, h: r.height, colW };
    el.classList.add('arrastrando');
    (mv || tm).setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', e => {
    if (!op) return;
    if (op.tipo === 'tam'){
      const cols = columnas();
      const c = Math.max(1, Math.min(cols, Math.round((op.w + e.clientX - op.x + HUECO) / (op.colW + HUECO))));
      const r = Math.max(MIN_R, Math.min(MAX_R, Math.round((op.h + e.clientY - op.y + HUECO) / (FILA + HUECO))));
      const t = tablero.tam[op.id] || {};
      if (t.c !== c || t.r !== r){ tablero.tam[op.id] = { c, r }; aplicarTablero(); }
      op.el.querySelector('.c-medida').textContent = c + ' × ' + r;
      return;
    }
    /* Mover: la tarjeta toma el lugar de la que está bajo el puntero. */
    const bajo = document.elementsFromPoint(e.clientX, e.clientY).map(x => x.closest && x.closest('.card')).find(x => x && x !== op.el);
    if (!bajo) return;
    const orden = ordenApps(), de = orden.indexOf(op.id), a = orden.indexOf(bajo.id.replace('card-', ''));
    if (de < 0 || a < 0 || de === a) return;
    orden.splice(de, 1); orden.splice(a, 0, op.id);
    tablero.orden = orden; aplicarTablero();
  });
  const fin = () => { if (!op) return; op.el.classList.remove('arrastrando'); op = null; guardarTablero(); };
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
  addEventListener('resize', aplicarTablero);
})();
function restablecerTablero(){ tablero = { orden: [], tam: {}, menu: [] }; guardarTablero(); aplicarTablero(); pintarMenu(); }
/* Reordenar los botones de apps de la barra izquierda mientras se organiza. */
(function arrastreMenu(){
  let mov = null;
  document.addEventListener('pointerdown', e => {
    if (!document.body.classList.contains('organizando')) return;
    const it = e.target.closest('#navList .item[data-id]');
    if (!it) return;
    e.preventDefault();
    mov = it.dataset.id;
    it.classList.add('moviendo');
  });
  document.addEventListener('pointermove', e => {
    if (!mov) return;
    const bajo = document.elementsFromPoint(e.clientX, e.clientY).map(x => x.closest && x.closest('#navList .item[data-id]')).find(x => x && x.dataset.id !== mov);
    if (!bajo) return;
    const orden = appsMenu().map(a => a.id), de = orden.indexOf(mov), a = orden.indexOf(bajo.dataset.id);
    orden.splice(de, 1); orden.splice(a, 0, mov);
    tablero.menu = orden; pintarMenu();
    document.querySelector(`#navList .item[data-id="${CSS.escape(mov)}"]`)?.classList.add('moviendo');
  });
  const fin = () => { if (!mov) return; mov = null; document.querySelectorAll('#navList .moviendo').forEach(x => x.classList.remove('moviendo')); guardarTablero(); };
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
})();

function repintarTarjeta(id){
  const el = document.getElementById('card-' + id);
  const a = APPS.find(x => x.id === id);
  if (el && a) el.innerHTML = tarjeta(a);
}
/* Las apps del mismo sitio escriben en localStorage: el navegador avisa al
   centro con 'storage'. La Agenda manda su resumen por postMessage. */
addEventListener('storage', e => { const m = (e.key || '').match(/^cc\.insight\.(.+)$/); if (m) repintarTarjeta(m[1]); });
addEventListener('message', e => {
  const d = e.data;
  if (!d || d.tipo !== 'cc:insight' || !d.id || !d.insight) return;
  const a = APPS.find(x => x.id === d.id);
  if (!a) return;
  const permitido = e.origin === location.origin || (() => { try { return new URL(a.url, location.href).origin === e.origin; } catch { return false; } })();
  if (!permitido) return;
  if (new URL(a.url, location.href).origin !== location.origin) guardar('insight.' + d.id, JSON.stringify(d.insight));
  repintarTarjeta(d.id);
});
/* Las apps marcadas con "precargar" se abren escondidas al arrancar, para
   que su tarjeta tenga datos frescos sin tener que entrar. */
function precargar(){
  APPS.filter(a => a.precargar && a.modo !== 'pestana').forEach(a => {
    const w = frames[a.id] || crearFrame(a);
    const pedir = () => { try { w.querySelector('iframe').contentWindow.postMessage({ tipo: 'cc:resumen' }, '*'); } catch {} };
    if (w.dataset.cargada) { avisarApp(w); pedir(); }
    else w.querySelector('iframe').addEventListener('load', () => setTimeout(pedir, 1500), { once: true });
  });
}

function agregarApp(){
  document.getElementById('sheetT').textContent = 'Agregar una aplicación';
  document.getElementById('sheetPasos').innerHTML = [
    'Abre <b>apps.json</b> del centro en GitHub (repositorio <code>centro_control_pana</code>).',
    'Copia un bloque de una app y cambia <b>id</b>, <b>nombre</b>, <b>url</b> e <b>icono</b>.',
    'Guarda el cambio: Vercel lo publica solo y la app aparece aquí y en el menú.',
    '¿Quieres que tenga tarjeta con resumen? Pídeselo a Claude: la app tiene que dejar su resumen como las demás.',
  ].map(x => `<li>${x}</li>`).join('') + `<li style="list-style:none;margin-top:6px"><a class="btn pri" style="display:inline-flex" href="https://github.com/kurtbrinze/centro_control_pana/edit/main/apps.json" target="_blank" rel="noopener">${ico('aparte','i sm')}Abrir apps.json</a></li>`;
  document.getElementById('sheet').classList.add('show');
}

function pintarTopbar(){
  const tb = document.getElementById('topbar');
  const a = APPS.find(x => x.id === actual);
  if (!a){
    tb.innerHTML = `<div class="ttl"><h1>Inicio</h1></div><div class="acts" style="align-items:center;gap:10px"><button class="btn cal-movil" onclick="calAlternar()" title="Calendario">${ico('calendario','i sm')}</button><button class="btn tema-movil" onclick="temaAlternar()" title="Cambiar a tema ${temaActual() === 'oscuro' ? 'claro' : 'oscuro'}">${ico(temaActual() === 'oscuro' ? 'sol' : 'luna','i sm')}</button><button class="btn pri inst${puedeInstalar() ? ' show' : ''}" onclick="instalar()">${ico('instalar','i sm')}<span class="t">Instalar app</span></button><span class="ver">${VERSION}</span></div>`;
    return;
  }
  tb.innerHTML = `
    <div class="ttl">${ico(a.icono)}<div style="min-width:0"><h1>${esc(a.nombre)}</h1><div class="host">${esc(hostDe(a.url))}</div></div></div>
    <div class="acts">
      <button class="btn cal-movil" onclick="calAlternar()" title="Calendario">${ico('calendario','i sm')}</button>
      <button class="btn tema-movil" onclick="temaAlternar()" title="Cambiar a tema ${temaActual() === 'oscuro' ? 'claro' : 'oscuro'}">${ico(temaActual() === 'oscuro' ? 'sol' : 'luna','i sm')}</button>
      <button class="btn" onclick="recargar()" title="Recargar">${ico('recargar','i sm')}<span class="t">Recargar</span></button>
      <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener" title="Abrir aparte">${ico('aparte','i sm')}<span class="t">Abrir aparte</span></a>
      <button class="btn pri" onclick="go('')" title="Inicio">${ico('inicio','i sm')}<span class="t">Inicio</span></button>
    </div>`;
}

function crearFrame(a){
  const wrap = document.createElement('div');
  wrap.className = 'frame';
  wrap.innerHTML = `
    <iframe title="${esc(a.nombre)}" allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen; display-capture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="loader"><div class="box">
      <div class="spin"></div>
      <div class="msg">Abriendo ${esc(a.nombre)}…</div>
      <div class="slow"><span>Está tardando más de lo normal. Puede que esta app no permita abrirse dentro del centro.</span>
        <a class="btn pri" href="${esc(a.url)}" target="_blank" rel="noopener">${ico('aparte','i sm')}Abrir aparte</a></div>
    </div></div>`;
  const f = wrap.querySelector('iframe');
  const ld = wrap.querySelector('.loader');
  const lento = setTimeout(() => ld.classList.add('late'), 10000);
  f.addEventListener('load', () => { clearTimeout(lento); ld.classList.add('gone'); wrap.dataset.cargada = '1'; try { f.contentWindow.postMessage({ tipo: 'cc:tema', tema: temaActual() }, '*'); } catch (_) {} });
  f.src = a.url;
  document.getElementById('frames').appendChild(wrap);
  frames[a.id] = wrap;
  return wrap;
}

function mostrar(){
  const a = APPS.find(x => x.id === actual);
  document.getElementById('home').style.display = a ? 'none' : '';
  /* De vuelta en Inicio: tarjetas al día y la Agenda escondida trae lo último. */
  if (!a && document.getElementById('tarjetas')) { APPS.forEach(x => repintarTarjeta(x.id)); aplicarTablero(); precargar(); }
  if (a && document.getElementById('tarjetas')) organizar(false);
  Object.values(frames).forEach(w => w.classList.remove('on'));
  if (a){
    const w = frames[a.id] || crearFrame(a);
    w.classList.add('on');
    /* Al volver a una app que ya estaba abierta, se le avisa para que traiga
       lo último de su nube (Producción y Agenda sincronizan con Vercel Blob). */
    if (w.dataset.cargada) avisarApp(w);
  }
  document.querySelectorAll('.item[data-id], .bottom button').forEach(b => b.classList.toggle('on', (b.dataset.id ?? '') === (a ? a.id : '')));
  document.getElementById('nav-home').classList.toggle('on', !a);
  document.title = (a ? a.nombre + ' · ' : '') + 'Centro de Control';
  pintarTopbar();
}

function avisarApp(w){
  try { w.querySelector('iframe').contentWindow.postMessage({tipo:'cc:mostrar'}, '*'); } catch {}
}

function go(id){
  /* Mientras se organiza, tocar una app no la abre: sólo se mueve. */
  if (id && document.body.classList.contains('organizando')) return;
  const a = APPS.find(x => x.id === id);
  if (a && a.modo === 'pestana'){ window.open(a.url, '_blank', 'noopener'); return; }
  location.hash = a ? '#/' + a.id : '#/';
}

function recargar(){
  const a = APPS.find(x => x.id === actual);
  if (!a || !frames[a.id]) return;
  frames[a.id].remove();
  delete frames[a.id];
  mostrar();
}

function leerHash(){
  const id = decodeURIComponent((location.hash.match(/^#\/(.+)$/) || [])[1] || '');
  actual = APPS.some(a => a.id === id) ? id : '';
  guardar('ultima', actual);
  mostrar();
}

/* ---------- Calendario: semanas normales y semanas Walmart ----------
   Semana normal: ISO 8601, de lunes a domingo; la semana 1 es la que tiene
   el primer jueves del año.
   Semana Walmart: de sábado a viernes. El año fiscal arranca el sábado más
   cercano al 1 de febrero, y la semana se escribe año + número (202643),
   igual que en la Agenda. */
const DIA = 864e5;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fecha = (y, m, d) => new Date(y, m, d, 12);
const sumar = (f, n) => new Date(f.getTime() + n * DIA);
const igual = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const corta = f => f.getDate() + ' ' + MESES[f.getMonth()].slice(0, 3);
function semISO(f){
  const d = new Date(Date.UTC(f.getFullYear(), f.getMonth(), f.getDate()));
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);   // jueves de esa semana
  const y = d.getUTCFullYear(), e = new Date(Date.UTC(y, 0, 4));
  return { y, w: 1 + Math.round(((d - e) / DIA - 3 + ((e.getUTCDay() + 6) % 7)) / 7) };
}
function inicioWM(y){
  const f = fecha(y, 1, 1);
  let d = 6 - f.getDay(); if (d > 3) d -= 7;
  return sumar(f, d);
}
function semWM(f){
  let y = f.getFullYear();
  if (f < inicioWM(y)) y--;
  const w = Math.floor(Math.round((f - inicioWM(y)) / DIA) / 7) + 1;
  return { y, w, cod: String(y) + String(w).padStart(2, '0') };
}
const lunesDe = f => sumar(f, -((f.getDay() + 6) % 7));
const sabadoDe = f => sumar(f, -((f.getDay() + 1) % 7));

function hoyResumen(){
  const h = new Date(); const n = semISO(h), w = semWM(h), s = sabadoDe(h);
  return `${ico('calendario','i sm')}<span>Semana <b>${n.w}</b></span><span class="sepv"></span><span>Semana Walmart <span class="wm">${w.cod}</span> · ${corta(s)} – ${corta(sumar(s, 6))}</span><span class="ver-cal">Ver calendario</span>`;
}

const cal = { y: new Date().getFullYear(), modo: 'normal', sel: null };
try { const g = JSON.parse(leer('cal') || '{}'); if (g.modo === 'walmart') cal.modo = 'walmart'; cal.pos = g.pos; } catch {}
const guardarCal = () => guardar('cal', JSON.stringify({ modo: cal.modo, pos: cal.pos }));

function pintarCal(){
  const el = document.getElementById('cal');
  el.classList.toggle('wm', cal.modo === 'walmart');
  document.getElementById('calHd').innerHTML = `
    <span class="tt">${ico('calendario','i sm')}Calendario</span>
    <span class="cal-yr"><button class="ib" data-c="ant" aria-label="Año anterior">${ico('izq','i sm')}</button><b>${cal.y}</b><button class="ib" data-c="sig" aria-label="Año siguiente">${ico('der','i sm')}</button></span>
    <span class="seg" role="tablist"><button data-c="normal" class="${cal.modo === 'normal' ? 'on' : ''}">Semana normal</button><button data-c="walmart" class="w ${cal.modo === 'walmart' ? 'on' : ''}">Semana Walmart</button></span>
    <button class="cal-hoy" data-c="hoy">Hoy</button>
    <button class="ib" data-c="cerrar" aria-label="Cerrar">${ico('cerrar','i sm')}</button>`;
  const hoy = new Date();
  const wm = cal.modo === 'walmart';
  const cab = (wm ? ['S','D','L','M','M','J','V'] : ['L','M','M','J','V','S','D']);
  let h = '';
  for (let m = 0; m < 12; m++){
    const p = fecha(cal.y, m, 1), u = fecha(cal.y, m + 1, 0);
    let f = wm ? sabadoDe(p) : lunesDe(p);
    let filas = '';
    while (f <= u){
      const num = wm ? semWM(f).w : semISO(f).w;
      const esHoy = hoy >= f && hoy < sumar(f, 7);
      let c = `<td class="n">${num}</td>`;
      for (let i = 0; i < 7; i++){
        const d = sumar(f, i);
        if (d.getMonth() !== m) { c += '<td></td>'; continue; }
        const cls = ['d'];
        if (d.getDay() === 0 || d.getDay() === 6) cls.push('fin');
        if (igual(d, hoy)) cls.push('hoyd');
        if (cal.sel && igual(d, cal.sel)) cls.push('sel');
        c += `<td class="${cls.join(' ')}" data-f="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}">${d.getDate()}</td>`;
      }
      filas += `<tr class="${esHoy ? 'semhoy' : ''}">${c}</tr>`;
      f = sumar(f, 7);
    }
    const act = hoy.getFullYear() === cal.y && hoy.getMonth() === m;
    h += `<div class="mes${act ? ' act' : ''}" id="mes${m}"><h4>${MESES[m][0].toUpperCase() + MESES[m].slice(1)}</h4><table><tr><th>${wm ? 'WM' : 'Sem'}</th>${cab.map(x => `<th>${x}</th>`).join('')}</tr>${filas}</table></div>`;
  }
  document.getElementById('calBd').innerHTML = h;
  const d = cal.sel || hoy;
  const n = semISO(d), w = semWM(d), l = lunesDe(d), s = sabadoDe(d);
  document.getElementById('calFt').innerHTML = `
    <span><b>${DIAS[d.getDay()][0].toUpperCase() + DIAS[d.getDay()].slice(1)} ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}</b></span>
    <span>Semana <b>${n.w}</b> · ${corta(l)} – ${corta(sumar(l, 6))}</span>
    <span>Semana Walmart <span class="wm">${w.cod}</span> · ${corta(s)} – ${corta(sumar(s, 6))}</span>`;
}
function calPosicionar(){
  const el = document.getElementById('cal');
  if (innerWidth <= 640) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = cal.pos ? cal.pos.x : innerWidth - w - 24;
  let y = cal.pos ? cal.pos.y : 72;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  y = Math.max(8, Math.min(y, innerHeight - 60));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function calAbrir(){
  const el = document.getElementById('cal');
  el.classList.add('show');
  pintarCal(); calPosicionar();
  const hoy = new Date();
  if (cal.y === hoy.getFullYear()) document.getElementById('mes' + hoy.getMonth())?.scrollIntoView({ block: 'nearest' });
}
function calCerrar(){ document.getElementById('cal').classList.remove('show'); }
function calAlternar(){ document.getElementById('cal').classList.contains('show') ? calCerrar() : calAbrir(); }

document.addEventListener('click', e => {
  const el = document.getElementById('cal');
  if (!el.contains(e.target)) return;
  const b = e.target.closest('[data-c]');
  if (b){
    const c = b.dataset.c;
    if (c === 'ant') cal.y--;
    else if (c === 'sig') cal.y++;
    else if (c === 'normal' || c === 'walmart') { cal.modo = c; guardarCal(); }
    else if (c === 'hoy') { cal.y = new Date().getFullYear(); cal.sel = null; }
    else if (c === 'cerrar') { calCerrar(); return; }
    pintarCal();
    if (c === 'hoy') document.getElementById('mes' + new Date().getMonth())?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return;
  }
  const td = e.target.closest('td.d');
  if (td){ const [y, m, d] = td.dataset.f.split('-').map(Number); cal.sel = fecha(y, m, d); pintarCal(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') calCerrar();
  if (e.altKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); calAlternar(); }
});
/* Mover la ventana arrastrando su barra. Mientras se arrastra, un escudo
   transparente tapa las apps embebidas para que no se queden con el puntero. */
(function arrastre(){
  let ini = null;
  const el = () => document.getElementById('cal');
  document.addEventListener('pointerdown', e => {
    const hd = e.target.closest('#calHd');
    if (!hd || e.target.closest('button') || innerWidth <= 640) return;
    const r = el().getBoundingClientRect();
    ini = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    el().classList.add('arr');
    hd.setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', e => {
    if (!ini) return;
    cal.pos = { x: e.clientX - ini.dx, y: e.clientY - ini.dy };
    calPosicionar();
  });
  const fin = () => { if (!ini) return; ini = null; el().classList.remove('arr'); guardarCal(); };
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
  addEventListener('resize', () => { if (el().classList.contains('show')) calPosicionar(); });
})();

/* ---------- Tema claro / oscuro ----------
   Se guarda en rz.tema y se manda a cada app abierta: las del mismo sitio
   lo leen al abrir y todas lo cambian en vivo con el mensaje cc:tema. */
const temaActual = () => document.documentElement.getAttribute('data-tema') === 'claro' ? 'claro' : 'oscuro';
function pintarTema(){
  const t = temaActual(), otro = t === 'oscuro' ? 'claro' : 'oscuro';
  const b = document.getElementById('temaRail');
  b.innerHTML = ico(t === 'oscuro' ? 'sol' : 'luna') + `<span class="lbl">${t === 'oscuro' ? 'Tema claro' : 'Tema oscuro'}</span>`;
  b.title = 'Cambiar a tema ' + otro + ' en el Centro y en todas las apps';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'oscuro' ? '#0D0F12' : '#F8FAFC');
}
function temaAlternar(){
  const t = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
  try { localStorage.setItem('rz.tema', t); } catch (_) {}
  document.documentElement.setAttribute('data-tema', t);
  document.querySelectorAll('iframe').forEach(f => { try { f.contentWindow.postMessage({ tipo: 'cc:tema', tema: t }, '*'); } catch (_) {} });
  pintarTema(); pintarTopbar();
}

/* ---------- Instalar como app ---------- */
let promptInstalar = null;
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const puedeInstalar = () => !instalada() && (!!promptInstalar || esIOS());
function pintarInstalar(){
  const r = document.getElementById('instRail');
  r.innerHTML = ico('instalar') + '<span class="lbl">Instalar</span>';
  document.getElementById('calRail').innerHTML = ico('calendario') + '<span class="lbl">Calendario</span>';
  pintarTema();
  document.querySelectorAll('.inst').forEach(b => b.classList.toggle('show', puedeInstalar()));
}
async function instalar(){
  if (promptInstalar){
    const p = promptInstalar; promptInstalar = null;
    try { p.prompt(); await p.userChoice; } catch {}
    pintarInstalar();
    return;
  }
  const pasos = esIOS()
    ? ['Abre esta página en <b>Safari</b>.', 'Toca <b>Compartir</b> (el cuadro con la flecha hacia arriba).', 'Elige <b>Agregar a inicio</b> y luego <b>Agregar</b>.']
    : /Android/.test(navigator.userAgent)
      ? ['Abre el menú de tres puntos del navegador.', 'Elige <b>Instalar aplicación</b>.']
      : ['Busca el ícono de instalar en la barra de direcciones de Chrome o Edge.', 'O abre el menú del navegador y elige <b>Instalar Centro de Control</b>.'];
  document.getElementById('sheetT').textContent = 'Instalar el Centro de Control';
  document.getElementById('sheetPasos').innerHTML = pasos.map(x => `<li>${x}</li>`).join('');
  document.getElementById('sheet').classList.add('show');
}
function cerrarSheet(){ document.getElementById('sheet').classList.remove('show'); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; pintarInstalar(); });
window.addEventListener('appinstalled', () => { promptInstalar = null; pintarInstalar(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

(async function iniciar(){
  await cargarRegistro();
  pintarNav();
  pintarInicio();
  pintarInstalar();
  /* Al abrir, el centro empieza siempre en Inicio. Chrome, al reabrir una
     ventana o la app instalada, puede traer la última dirección con su #/app;
     eso no cuenta. Sólo los accesos directos del ícono (?app=...) abren una
     app de entrada. */
  const pedida = new URLSearchParams(location.search).get('app');
  const inicial = APPS.some(a => a.id === pedida) ? '#/' + pedida : '#/';
  history.replaceState(null, '', location.pathname + inicial);
  window.addEventListener('hashchange', leerHash);
  leerHash();
  precargar();
})();
</script>
